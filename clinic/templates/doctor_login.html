
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | CareSync</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #1c1c1c;
            border: 1px solid #e60000;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #ff3030;
        }

        p {
            text-align: center;
            color: #bbb;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #292929;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #e60000;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b80000;
        }

        .error {
            padding: 12px;
            margin-top: 15px;
            background: #441b1b;
            color: #ff7777;
            border-radius: 6px;
        }

        .login-container h1 {
    margin-bottom: 8px;
}

.login-container p {
    font-size: 12px;
    letter-spacing: 2px;
    color: #aaa;
    margin-bottom: 25px;
}
    </style>
</head>

<body>

<div class="login-container">

    <h1>Doctor Login</h1>

    <p>SMARTER HEALTHCARE. CONNECTED CARE.</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login to Dashboard
        </button>
    </form>

</div>

</body>
</html>
