
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | CareSync</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
        }

        h1 {
            color: #ff3030;
            text-align: center;
        }

        .tagline {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #e60000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #b80000;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CareSync</h1>
        <p class="tagline">SMARTER HEALTHCARE. CONNECTED CARE.</p>

        <h2>Book an Appointment</h2>

        <form method="post">
            {% csrf_token %}

            <label for="doctor">Select Doctor:</label>

            <select name="doctor" id="doctor" required>
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">
                        {{ doctor.name }}
                    </option>
                {% endfor %}
            </select>

            <label for="date">Select Date:</label>

            <input type="date" name="date" id="date" required>

            <button type="submit">Book Appointment</button>
        </form>

    </div>

</body>
</html>
